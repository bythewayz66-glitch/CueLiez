[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cueliez"
version = "0.2.0"
description = "CueLiez (Cue + Legal Interview Engine): real-time signal observation and testimony cues for legal interviews. Not a lie detector."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CueLiez contributors" }]
keywords = ["legal", "interview", "observation", "cues", "signals"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Legal Industry",
  "Topic :: Sociology",
]
# Runtime dependencies intentionally empty (decision, 2026-11-08 iceman): core gates/seal/memory/
# observations/session/ingest/connectors use only Python stdlib. Pydantic/numpy/scipy are not
# imported or required by current schema validation or feature paths; add only when actually used.
dependencies = []

[project.scripts]
cueliez = "cueliez.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
# Live AV extras (Phase 10). Core stays dependency-free; each extra is
# installed separately and only used behind its consent gate.
live-audio = ["vosk>=0.3.45,<0.4"]
live-audio-whisper = ["faster-whisper>=1.2,<2"]
# Real face matching (Track D, delegates to Track B's observer):
# OpenFace nn4.small2.v1.t7 embeddings via OpenCV DNN. OpenCV 5.x
# removed the Torch model importer (cv2.dnn.readNetFromTorch), so 4.10
# is pinned for this extra. The face_recognition/dlib path was
# evaluated and set aside (no wheel for this Python/platform; source
# build needs cmake + C++ toolchain + gigabytes of build space), and
# Track B's OpenCV/OpenFace path already works here with measured
# separation on real portraits. Model files are resolved from
# CUELIEZ_FACE_MODEL_PATH / CUELIEZ_FACE_LANDMARK_MODEL_PATH, falling
# back to the copies vendored at tests/fixtures/face/models/.
face = ["opencv-contrib-python-headless==4.10.0.84"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
