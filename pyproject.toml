[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cueliez"
version = "0.2.0"
description = "CueLiez (Cue + Legal Interview Engine): real-time signal observation and testimony cues for legal interviews. Not a lie detector."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CueLiez contributors" }]
keywords = ["legal", "interview", "observation", "cues", "signals"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Legal Industry",
  "Topic :: Sociology",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
