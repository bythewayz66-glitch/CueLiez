name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Fake-code / stub scan
        run: python scripts/check_no_fake_code.py
      - name: Tracked artifact scan
        run: python scripts/check_no_tracked_artifacts.py
      - name: Version consistency
        run: python scripts/check_version_consistency.py
      - name: CLI help smoke (doc-contract)
        run: python -m cueliez --help > /dev/null
      - name: CLI contract checks
        run: python scripts/check_cli_contract.py
      - name: Schema/export/gate contract checks
        run: python scripts/check_contracts_phase9.py
      - name: Pytest
        run: python -m pytest -q
